services:
  trading-db:
    image: postgres:17-alpine
    container_name: trading-platform-db-dev
    environment:
      POSTGRES_DB: trading_platform_dev
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD: trading_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_user -d trading_platform_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev:
